[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "easydel-foundation"
version = "0.1.0"
description = "EasyDeL foundation workspace: easydel + spectrax + ejkernel + eformer + eray developed in one repo"
requires-python = ">=3.11,<3.14"
dependencies = ["easydel", "eray"]

# Root extras forward to the easydel member so the whole foundation installs with
# one selector, e.g. `uv sync --extra tpu --extra dev` (workspace-aware: the
# workspace packages come editable from libs/). Note: the pip-style
# `uv pip install -e .[tpu]` also works but resolves easydel & friends from
# PyPI, NOT from libs/ — use `uv sync` for development environments.
[project.optional-dependencies]
torch = ["easydel[torch]"]
cuda = ["easydel[cuda]"]
tpu = ["easydel[tpu]"]
tensorflow = ["easydel[tensorflow]"]
lm-eval = ["easydel[lm_eval]"]
profile = ["easydel[profile]"]
podutils = ["easydel[podutils]"]
mm = ["easydel[mm]"]
dev = ["import-linter>=2.0", "ruff", "pytest", "pre-commit", "basedpyright"]

[dependency-groups]
dev = ["import-linter>=2.0", "ruff", "pytest", "pre-commit", "basedpyright"]

# The root wheel is an empty meta-package: it exists so `-e .` style installs
# have a build backend (legacy setuptools chokes on the flat repo layout).
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.uv]
prerelease = "if-necessary-or-explicit"
# Linux is the deployment target; macOS (Apple Silicon) is supported for local
# development. The CUDA/TPU extras pull hardware packages (libtpu, nvidia-*,
# triton, ...) that only publish Linux wheels, so each of those requirements
# carries a `; sys_platform == 'linux'` marker in its member pyproject — on
# macOS the tpu/cuda/triton/tilelang extras resolve to nothing (you can't run
# TPU/CUDA on a Mac anyway) while the portable base still locks and syncs.
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]

[tool.uv.workspace]
members = ["libs/easydel", "libs/spectrax", "libs/ejkernel", "libs/eformer", "libs/eray"]

[tool.uv.sources]
easydel = { workspace = true }
eray = { workspace = true }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Layering contract for the workspace: easydel sits on top of the three
# foundation libraries; the foundation libraries must stay independent of
# easydel AND of each other (ejkernel's eformer dep is a dev/test extra only).
# Enforced in CI via `lint-imports`.
[tool.importlinter]
root_packages = ["easydel", "spectrax", "ejkernel", "eformer", "eray"]

[[tool.importlinter.contracts]]
name = "foundation libs must not import easydel"
type = "forbidden"
source_modules = ["spectrax", "ejkernel", "eformer", "eray"]
forbidden_modules = ["easydel"]

[[tool.importlinter.contracts]]
name = "foundation libs stay independent of each other"
type = "independence"
modules = ["spectrax", "ejkernel", "eformer", "eray"]

[tool.black]
line-length = 121
target-version = ["py311"]
preview = true

[tool.ruff]
line-length = 121
target-version = "py311"


[tool.basedpyright]
# Keep the linter useful: correctness diagnostics stay enabled, while the
# dynamic JAX/SpectraX/model-registry noise is muted below.
reportAssignmentType = "none"
reportUnknownVariableType = "none"
reportPrivateUsage = "none"
reportPrivateLocalImportUsage = "none"
reportOptionalCall = "none"
reportUnknownMemberType = "none"
reportGeneralTypeIssues = "none"
reportArgumentType = "none"
enableTypeIgnoreComments = true
reportMissingTypeArgument = "none"
reportUnknownParameterType = "none"
reportAny = "none"
reportCallIssue = "none"
reportUnknownArgumentType = "none"
reportRedeclaration = "none"
reportCallInDefaultInitializer = "none"
reportConstantRedefinition = "none"
reportDeprecated = "none"
reportFunctionMemberAccess = "none"
reportImportCycles = "none"
reportImplicitRelativeImport = "none"
reportInconsistentConstructor = "none"
reportInconsistentOverload = "error"
reportInvalidCast = "none"
reportInvalidTypeArguments = "error"
reportInvalidTypeForm = "none"
reportInvalidTypeVarUse = "none"
reportMissingImports = "error"
reportMissingSuperCall = "none"
reportMissingTypeStubs = "none"
reportOptionalContextManager = "error"
reportOptionalIterable = "error"
reportOptionalOperand = "error"
reportOptionalSubscript = "error"
reportPossiblyUnboundVariable = "error"
reportPropertyTypeMismatch = "none"
reportReturnType = "error"
reportTypedDictNotRequiredAccess = "none"
reportUnsupportedDunderAll = "none"
reportUnnecessaryCast = "none"
reportUnhashable = "error"
reportUnnecessaryComparison = "none"
reportUnnecessaryContains = "none"
reportUnnecessaryTypeIgnoreComment = "none"
reportUntypedBaseClass = "none"
reportUntypedFunctionDecorator = "none"
reportUnusedClass = "none"
reportUnusedFunction = "none"
reportUnusedImport = "none"
reportUnusedVariable = "none"
reportIgnoreCommentWithoutRule = "none"
reportUnnecessaryIsInstance = "none"
reportUnusedCallResult = "none"
reportUnknownLambdaType = "none"
reportUnannotatedClassAttribute = "none"
reportImplicitStringConcatenation = "none"
reportMissingParameterType = "none"
reportImplicitOverride = "none"
reportImplicitAbstractClass = "none"
reportExplicitAny = "none"
reportIncompatibleMethodOverride = "none"
reportIndexIssue = "none"
reportAttributeAccessIssue = "none"
reportUnreachable = "none"
reportOptionalMemberAccess = "none"
reportOperatorIssue = "none"
reportUninitializedInstanceVariable = "none"
reportIncompatibleVariableOverride = "none"
reportPrivateImportUsage = "none"
reportUnusedParameter = "none"
