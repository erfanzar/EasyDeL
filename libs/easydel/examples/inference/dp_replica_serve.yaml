# One-command data-parallel eSurge serving.
#
#   python -m easydel.scripts.elarge --config dp_replica_serve.yaml
#
# eLarge carves this host's TPU chips into `replicas.count` independent
# replica engines (each its own JAX world on a contiguous chip subset),
# then starts a routed OpenAI API server in front of them. Validated on a
# v5p-8: two replicas x two chips, coherent chat + concurrent load spread
# across both replicas.
#
# The parent router process runs CPU-pinned (it re-execs itself so the
# replicas own the accelerator), connects to each replica over the request
# plane, and load-balances with prefix-affinity + join-shortest-queue.
#
# To serve replicas that live on OTHER hosts instead of splitting one host,
# drop `count` and pass `endpoints: ["host1:19760", "host2:19760", ...]`
# under `replicas` — launch one `serve_replica` per host, route here.

config:
  model:
    name_or_path: Qwen/Qwen3.5-4B
    dtype: bf16
  esurge:
    runtime:
      max_model_len: 4096
      max_num_seqs: 16
    cache:
      hbm_utilization: 0.6
      page_size: 32
    parsing:
      tool_parser: ""
      reasoning_parser: ""

actions:
  - serve:
      host: "0.0.0.0"
      port: 11556
      replicas:
        count: 2                 # split this host's chips into 2 replicas
        base_control_port: 19760 # replica i binds request plane on 19760 + i
