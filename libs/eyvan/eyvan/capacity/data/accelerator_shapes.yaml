  # ---------------------------------------------------------------- GPU hosts
  #
  # vCPU, instance memory and GPU count are the published machine-shape table on
  # the accelerator-optimized machine families page. The `gpu_model` values are
  # the provider's own accelerator names from the GPU machine types page
  # (https://cloud.google.com/compute/docs/gpus, "Last updated 2026-08-05 UTC"),
  # which maps A3 High -> nvidia-h100-80gb, A2 Standard -> nvidia-tesla-a100 and
  # G2 -> nvidia-l4.
  #
  # Google labels the memory column "GB"; as with the TPU rows above, Eyvan
  # retains the published number in its historical `memory_gib` admission unit
  # so one shape is not measured two ways. G2 memory is the DEFAULT instance
  # memory; that family also accepts a custom range, and a pool that uses one
  # states it as an explicit positive override.
  #
  # Three families rather than one so the single-GPU and multi-GPU host cases
  # are both described by shipped data rather than by a test fixture.

  - accelerator_type: a3-highgpu-8g
    kind: gpu
    generation: a3-high
    chips: 8
    quota_units: 8
    hosts: 1
    chips_per_host: 8
    host_cpu: 208
    host_memory_gib: 1872
    capacity_backend: gcp-compute
    multislice_capable: false
    gpu_model: nvidia-h100-80gb
    machine_type: a3-highgpu-8g
    source_url: https://cloud.google.com/compute/docs/accelerator-optimized-machines
    source_version: "Last updated 2026-08-07 UTC"

