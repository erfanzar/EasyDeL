name: Image

# Publishes the three Eyvan images to this repository's own GHCR namespace.
# GITHUB_TOKEN with packages:write is enough -- no secret to configure, and no
# credential that outlives the job.
#
# Every base image argument is read from oci/release-lock.json rather than
# written here. The lock is what `scripts/verify_eyvan_oci_release.py
# validate-policy` checks, so a base image can only change by changing the file
# that the policy verifier reads -- not by editing a workflow nobody diffs.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.role }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: control-plane
            image: eyvan
            dockerfile: Dockerfile
          - role: agent
            image: eyvan-agent
            dockerfile: Dockerfile.agent
          - role: worker
            image: eyvan-worker
            dockerfile: Dockerfile.worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the version and the locked base images
        id: locked
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib, re

          version = re.search(
              r'^version = "([^"]+)"', pathlib.Path("pyproject.toml").read_text(), re.MULTILINE
          ).group(1)
          lock = json.loads(pathlib.Path("oci/release-lock.json").read_text())
          args = lock["images"][os.environ["ROLE"]]["buildArgs"]
          print(f"version={version}")
          print("build_args<<EOF")
          for name, value in sorted(args.items()):
              print(f"{name}={value}")
          print("EOF")
          PY
        env:
          ROLE: ${{ matrix.role }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # amd64 only, deliberately. A manifest claiming arm64 that nobody has
          # run is a claim, and every Dockerfile here fails closed outside
          # linux/amd64 anyway.
          platforms: linux/amd64
          push: true
          # Development builds use source-SHA locators only. Version tags are
          # reserved for the gated OCI release promotion lane; publishing them
          # here would retarget a qualified release on the next main push.
          # Never publish `latest`; deploy verified receipt digests, not tags.
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}
          build-args: |
            ${{ steps.locked.outputs.build_args }}
            EYVAN_SOURCE=https://github.com/${{ github.repository }}
            EYVAN_REVISION=${{ github.sha }}
            EYVAN_VERSION=${{ steps.locked.outputs.version }}
          provenance: true
          sbom: true
