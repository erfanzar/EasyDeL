[package]
name = "surgecore"
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "EasyDeL's native host library for the eSurge inference engine"
publish = false

[lib]
name = "surgecore"
crate-type = ["cdylib"]

[features]
# The Python bindings. `cargo test --no-default-features` tests the pure-Rust core without a Python interpreter.
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py311"], optional = true }
numpy = { version = "0.30.0", optional = true }
