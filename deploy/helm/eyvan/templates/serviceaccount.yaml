apiVersion: v1
kind: ServiceAccount
metadata:
  name: eyvan-control-plane
  namespace: {{ include "eyvan.namespace" . }}
{{- with .Values.serviceAccounts.controlPlane.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- if .Values.cellAgent.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eyvan-cell-agent
  namespace: {{ include "eyvan.namespace" . }}
{{- with .Values.serviceAccounts.cellAgent.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- if eq (include "eyvan.capacityBackend" .) "kubernetes" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eyvan-native-worker
  namespace: {{ include "eyvan.workerNamespace" . }}
{{- with .Values.serviceAccounts.worker.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
{{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
