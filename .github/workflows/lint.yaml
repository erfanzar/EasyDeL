name: Lint

on:
  push:
    branches: [main, vnext]
  pull_request:
    branches: [main, vnext]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # basedpyright resolves imports from the environment; without the workspace installed every
      # import of jax/spectrax/eformer/transformers is reported as missing.
      - name: Sync workspace
        run: uv sync

      - name: Extract version from pyproject.toml
        id: meta
        run: |
          VERSION=$(grep '^version = ' libs/easydel/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Ruff
        run: uv run --no-sync ruff check libs/easydel/easydel/ --config libs/easydel/pyproject.toml
        env:
          EASYDEL_VERSION: ${{ steps.meta.outputs.version }}

      # Report-only until the existing type errors are cleared; it still prints every diagnostic.
      - name: basedpyright (report-only)
        continue-on-error: true
        run: uv run --no-sync basedpyright libs/easydel/easydel
        env:
          EASYDEL_VERSION: ${{ steps.meta.outputs.version }}
