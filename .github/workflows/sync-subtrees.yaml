name: Sync subtree mirrors

# Pushes that touch a library under libs/ are automatically synced to that
# library's standalone repository via scripts/subtree-sync.sh push, so the
# mirrors (erfanzar/Spectrax, erfanzar/ejkernel, erfanzar/eformer,
# erfanzar/eray) always track the monorepo. The script replays only NEW
# commits onto the mirror's current main (message-prefixed, fast-forward) and
# tolerates the squashed `subtree pull` commits in monorepo history that a
# plain `git subtree split` chokes on. Requires the SUBTREE_SYNC_TOKEN
# secret: a fine-grained PAT with Contents read/write on the four mirror
# repositories.
#
# If a mirror has diverged (someone pushed to it directly), the sync here
# fails loudly. Reconcile from the monorepo with:
#   scripts/subtree-sync.sh pull <lib>
# then push again.

on:
  push:
    branches: [main, vnext]
    paths:
      - "libs/spectrax/**"
      - "libs/ejkernel/**"
      - "libs/eformer/**"
      - "libs/eray/**"
  workflow_dispatch:

concurrency:
  group: subtree-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lib: spectrax
            repo: erfanzar/Spectrax
          - lib: ejkernel
            repo: erfanzar/ejkernel
          - lib: eformer
            repo: erfanzar/eformer
          - lib: eray
            repo: erfanzar/eray
    steps:
      - name: Checkout (full history — subtree split walks it)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Don't persist the GITHUB_TOKEN extraheader: it applies to every
          # github.com URL and would shadow the PAT on pushes to the mirrors.
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync libs/${{ matrix.lib }} -> ${{ matrix.repo }}
        env:
          SUBTREE_SYNC_TOKEN: ${{ secrets.SUBTREE_SYNC_TOKEN }}
        run: |
          if [ -z "$SUBTREE_SYNC_TOKEN" ]; then
            echo "::error::SUBTREE_SYNC_TOKEN secret is not set. Create a fine-grained PAT with Contents read/write on the mirror repositories and add it as a repo secret."
            exit 1
          fi
          git config --global url."https://x-access-token:${SUBTREE_SYNC_TOKEN}@github.com/".insteadOf "https://github.com/"
          scripts/subtree-sync.sh push "${{ matrix.lib }}"
